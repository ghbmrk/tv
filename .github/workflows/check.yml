name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_public.py
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: executor/go.sum
      - name: Check the TV-owned agentOS executor
        working-directory: executor
        env:
          GOTOOLCHAIN: local
        run: |
          go test -mod=readonly -race ./...
          go vet -mod=readonly ./...
          mkdir -p ../.local
          go build -mod=readonly -o ../.local/tv-executor-interop ./cmd/interop
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :control-probe:lintDebug :control:assembleDebug :control:assembleDebugAndroidTest :control:lintDebug
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim -no-metrics
          script: |
            gradle -p android :app:connectedDebugAndroidTest :control:connectedDebugAndroidTest --no-daemon
            python tools/qualify_control_interop.py --serial emulator-5554 --go-executor .local/tv-executor-interop
      - uses: actions/upload-artifact@v4
        with:
          name: sovereign-tv-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/control/build/outputs/apk/debug/control-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/control/build/reports/
            android/control/build/outputs/androidTest-results/
